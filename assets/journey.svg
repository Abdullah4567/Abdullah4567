<svg width="830" height="170" viewBox="0 0 830 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Career journey: FAST NUCES 2020, PepsiCo 2022, Share Mobility 2024 with hackathon win, Eyratech 2025 to now, heading toward agentic AI.">
  <rect x="0.5" y="0.5" width="829" height="169" rx="14" fill="#16161e" stroke="#2f334d"/>
  <line x1="60" y1="85" x2="720" y2="85" stroke="#2f334d" stroke-width="2"/>
  <line x1="720" y1="85" x2="778" y2="85" stroke="#2f334d" stroke-width="2" stroke-dasharray="4 5"/>
  <polygon points="778,79 790,85 778,91" fill="#2f334d"/>

  <g font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif">
    <circle cx="95" cy="85" r="7" fill="#565f89"/>
    <text x="95" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#8b949e">2020</text>
    <text x="95" y="112" text-anchor="middle" font-size="12" fill="#a9b1d6">FAST NUCES</text>
    <text x="95" y="129" text-anchor="middle" font-size="10" fill="#565f89">BS Computer Science</text>

    <circle cx="275" cy="85" r="7" fill="#e0af68"/>
    <text x="275" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#e0af68">2022</text>
    <text x="275" y="112" text-anchor="middle" font-size="12" fill="#a9b1d6">PepsiCo</text>
    <text x="275" y="129" text-anchor="middle" font-size="10" fill="#565f89">BI &amp; data dashboards</text>

    <circle cx="455" cy="85" r="7" fill="#9ece6a"/>
    <text x="455" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#9ece6a">2024</text>
    <text x="455" y="112" text-anchor="middle" font-size="12" fill="#a9b1d6">Share Mobility</text>
    <text x="455" y="129" text-anchor="middle" font-size="10" fill="#565f89">Full stack · &#127942; hackathon win</text>

    <circle cx="625" cy="85" r="7" fill="#bb9af7">
      <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="625" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#bb9af7">2025 — now</text>
    <text x="625" y="112" text-anchor="middle" font-size="12" fill="#a9b1d6">Eyratech</text>
    <text x="625" y="129" text-anchor="middle" font-size="10" fill="#565f89">AI products end-to-end</text>

    <text x="770" y="62" text-anchor="middle" font-size="10" fill="#7dcfff">agentic AI &#8594;</text>
  </g>
</svg>
